<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fumaça — variantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Archivo:wdth,wght@62..125,300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --night: #0d0906; --ink: #f4ebe0; --ink-60: rgba(244, 235, 224, .6); --mono: "JetBrains Mono", ui-monospace, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--night); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; padding: 40px 16px 80px; }
  h1 { font-family: "Antonio", sans-serif; font-weight: 300; text-transform: uppercase; font-size: clamp(36px, 5vw, 64px); }
  .intro { color: var(--ink-60); max-width: 720px; margin: 12px 0 8px; font-size: 15px; }
  h2 { font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: .12em; margin: 48px 0 14px; color: var(--ink-60); }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  figure { position: relative; aspect-ratio: 16 / 11; overflow: hidden; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  figure .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Antonio", sans-serif; font-weight: 300; text-transform: uppercase; font-size: clamp(34px, 5vw, 76px); text-shadow: 0 1px 18px rgba(13, 9, 6, .7); pointer-events: none; }
  figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(13, 9, 6, .82); font-family: var(--mono); font-size: 11px; display: flex; justify-content: space-between; gap: 10px; }
  figcaption span + span { color: var(--ink-60); }
  label { display: inline-flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; margin-top: 14px; cursor: pointer; }
  @media (max-width: 820px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>Fumaça — variantes</h1>
  <p class="intro">Mesmo algoritmo das páginas de projeto (ruído fractal com domain warping, brasa de baixo, dither de 5 cores). Cada linha muda uma coisa só, pra comparar com o atual à esquerda.</p>

  <h2>ForeFire — movimento e faíscas</h2>
  <div class="row">
    <figure><canvas data-pal="ff" data-fps="11"></canvas><div class="t">ForeFire</div><figcaption><span>A · atual</span><span>11 qps</span></figcaption></figure>
    <figure><canvas data-pal="ff" data-fps="24"></canvas><div class="t">ForeFire</div><figcaption><span>B · mais fluida</span><span>24 qps</span></figcaption></figure>
    <figure><canvas data-pal="ff" data-fps="24" data-sparks></canvas><div class="t">ForeFire</div><figcaption><span>C · fluida + faíscas</span><span>24 qps</span></figcaption></figure>
  </div>

  <h2>Pantera — paleta com duas famílias de cor</h2>
  <div class="row" id="pantera">
    <figure><canvas data-pal="pa" data-fps="11"></canvas><div class="t">Pantera</div><figcaption><span>A · ocre atual</span><span>uma família</span></figcaption></figure>
    <figure><canvas data-pal="pa-cinza" data-fps="11" data-v></canvas><div class="t">Pantera</div><figcaption><span>B · fumaça cinza + ocre</span><span>sombra fria, luz quente</span></figcaption></figure>
    <figure><canvas data-pal="pa-terra" data-fps="11" data-v></canvas><div class="t">Pantera</div><figcaption><span>C · terra + ocre</span><span>sombra marrom, luz dourada</span></figcaption></figure>
  </div>
  <label><input type="checkbox" id="pa-motion"> aplicar 24 qps + faíscas nas paletas novas (B e C)</label>

<script>
(function () {
  var PALS = {
    'ff':       '8 26 12, 30 78 36, 84 136 64, 242 106 27, 246 220 160',
    'pa':       '40 26 4, 120 80 10, 196 140 40, 236 196 110, 246 236 214',
    'pa-cinza': '14 15 18, 52 52 54, 196 140 40, 236 196 110, 246 236 214',
    'pa-terra': '26 12 6, 92 40 16, 196 140 40, 238 198 104, 248 238 216'
  };
  var BAYER = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22,
               3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
  function parse(s) { return s.split(',').map(function (c) { return c.trim().split(/\s+/).map(Number); }); }
  function hash(x, y) {
    var h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function noise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  function fbm(x, y) {
    var s = 0, amp = .5;
    for (var o = 0; o < 4; o++) { s += amp * noise(x, y); x *= 2.03; y *= 2.03; amp *= .5; }
    return s;
  }

  function Scene(c) {
    this.c = c; this.ctx = c.getContext('2d'); this.t = 0; this.last = 0;
    this.pal = parse(PALS[c.dataset.pal]);
    this.base = { fps: +c.dataset.fps, sparks: c.hasAttribute('data-sparks') };
    this.fps = this.base.fps; this.sparks = this.base.sparks; this.parts = [];
    this.size();
  }
  Scene.prototype.size = function () {
    var r = this.c.getBoundingClientRect(), scale = innerWidth < 820 ? 3 : 4;
    this.w = this.c.width = Math.max(40, Math.round(r.width / scale));
    this.h = this.c.height = Math.max(24, Math.round(r.height / scale));
    this.img = this.ctx.createImageData(this.w, this.h);
    this.k = 7 / Math.max(this.w, this.h);
  };
  Scene.prototype.step = function (dt) {
    // dt em unidades do atual (1 = um quadro de 90 ms)
    this.t += .045 * dt;
    if (!this.sparks) { this.parts.length = 0; return; }
    var w = this.w, h = this.h;
    if (Math.random() < .55 * dt) this.parts.push({ x: Math.random() * w, y: h - 1, vy: -(.5 + Math.random() * .9), ph: Math.random() * 6, life: 1, decay: .012 + Math.random() * .02 });
    this.parts = this.parts.filter(function (p) {
      p.y += p.vy * dt * 1.6; p.x += Math.sin(p.y * .15 + p.ph) * .35 * dt; p.life -= p.decay * dt;
      return p.life > 0 && p.y > 0;
    });
  };
  Scene.prototype.draw = function () {
    var w = this.w, h = this.h, d = this.img.data, k = this.k, t = this.t, P = this.pal, n = P.length - 1;
    for (var y = 0; y < h; y++) {
      var fy = y / h, glow = Math.pow(fy, 1.8) * .55;
      for (var x = 0; x < w; x++) {
        var px = x * k, py = y * k + t;
        var warp = fbm(px * .6 + 3.1, py * .6 - t * .3);
        var smoke = fbm(px + warp * 1.6, py);
        var v = glow + Math.max(0, smoke - .38) * (.35 + .9 * fy);
        var q = Math.min(n, Math.max(0, Math.floor(v * n + (BAYER[(y & 7) * 8 + (x & 7)] + .5) / 64)));
        var c = P[q], i = (y * w + x) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
      }
    }
    this.parts.forEach(function (p) {
      var x = Math.round(p.x), y = Math.round(p.y);
      if (x < 0 || x >= w || y < 0 || y >= h) return;
      var c = P[p.life > .55 ? n : n - 1], i = (y * w + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    });
    this.ctx.putImageData(this.img, 0, 0);
  };

  var scenes = [].map.call(document.querySelectorAll('canvas[data-pal]'), function (c) { var s = new Scene(c); s.draw(); return s; });

  document.getElementById('pa-motion').addEventListener('change', function (e) {
    scenes.forEach(function (s) {
      if (!s.c.hasAttribute('data-v')) return;
      s.fps = e.target.checked ? 24 : s.base.fps; s.sparks = e.target.checked || s.base.sparks;
    });
  });

  (function loop(ts) {
    scenes.forEach(function (s) {
      var iv = 1000 / s.fps;
      if (ts - s.last >= iv) { s.step(Math.min(3, (ts - s.last) / 90)); s.last = ts; s.draw(); }
    });
    requestAnimationFrame(loop);
  })(0);

  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { scenes.forEach(function (s) { s.size(); s.draw(); }); }, 150); });
})();
</script>
</body>
</html>
