<!DOCTYPE html>
<!-- Fonte das imagens de compartilhamento (1200×630). Página e idioma vêm da query: og.html?p=home|pantera|agents|forefire&lang=en|pt
     Renderizar com: python _src/og/render.py -->
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  var Q = new URLSearchParams(location.search), P = Q.get('p') || 'home', L = Q.get('lang') || 'en';
  if (P !== 'home') document.documentElement.dataset.skin = P;
  document.documentElement.lang = L === 'pt' ? 'pt-BR' : 'en';
</script>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Archivo:wdth,wght@62..125,300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/ember-project.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; }
  body::before { position: absolute; }
  canvas.atmo { z-index: 0; }
  .shade { position: absolute; inset: 0; z-index: 1;
    background:
      radial-gradient(ellipse 62% 50% at 50% 46%, rgba(var(--shade), .66), rgba(var(--shade), 0) 100%),
      linear-gradient(180deg, rgba(var(--shade), .55) 0%, rgba(var(--shade), 0) 24%, rgba(var(--shade), 0) 58%, var(--stage-fade) 100%); }
  .og { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; text-shadow: 0 1px 18px rgba(var(--shade), .7); }
  .og nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 34px 56px 0; font-size: 13px; }
  .og nav .r { text-align: right; }
  .og .sigil { width: 40px; height: 40px; font-size: 13px; }
  .og .mid { margin: auto 0; text-align: center; padding: 0 56px; }
  .og .mid .label { font-size: 15px; margin-bottom: 22px; }
  .og h1 { font-size: 150px; }
  .og .lede { max-width: 980px; margin: 34px auto 0; font-family: var(--display); font-weight: 300; font-size: 34px; line-height: 1.1; }
  .og .lede b { display: block; font-weight: 500; color: var(--gold); }
  .home .shade { background:
      radial-gradient(ellipse 62% 50% at 50% 46%, rgba(var(--shade), .66), rgba(var(--shade), 0) 100%),
      linear-gradient(180deg, rgba(var(--shade), .8) 0%, rgba(var(--shade), .2) 26%, rgba(var(--shade), 0) 58%, var(--stage-fade) 100%); }
  .og .gauges { margin: 0 56px 38px; }
  .og .gauge .n { font-size: 76px; }
  .og .gauge p { font-size: 16px; margin-top: 6px; max-width: none; }
</style>
</head>
<body>
  <canvas class="atmo" id="bg" aria-hidden="true"></canvas>
  <div class="shade"></div>
  <div class="og">
    <nav class="label"><span id="who">Antonio Leblanc</span><div class="sigil">AL</div><span class="r">antonioleblanc.com</span></nav>
    <div class="mid">
      <div class="label" id="eyebrow"></div>
      <h1 class="display" id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="gauges" id="gauges"></div>
  </div>
<script>
  var T = {
    home: {
      en: { eyebrow: 'Rio de Janeiro · Climate, energy &amp; AI', title: 'Antonio Leblanc',
            lede: 'Today I lead an AI platform <b>that protects 40 million hectares from wildfires.</b>',
            g: [['190', 'Cameras in the field'], ['98<small>%</small>', 'Of fires: our AI sees them first'], ['9', 'AI agents in production']] },
      pt: { eyebrow: 'Rio de Janeiro · Clima, energia e IA', title: 'Antonio Leblanc',
            lede: 'Hoje lidero uma plataforma de IA <b>que protege 40 milhões de hectares contra incêndios.</b>',
            g: [['190', 'Câmeras em campo'], ['98<small>%</small>', 'Dos incêndios: nossa IA vê primeiro'], ['9', 'Agentes de IA em produção']] }
    },
    pantera: {
      en: { eyebrow: '01 — Wildfire AI · 1.5°C', title: 'Pantera',
            g: [['190', 'Cameras in the network'], ['40<small>M+</small>', 'Hectares under watch'], ['98<small>%</small>', 'Of fires: our AI sees them first']] },
      pt: { eyebrow: '01 — IA contra incêndios · 1.5°C', title: 'Pantera',
            g: [['190', 'Câmeras na rede'], ['40<small>M+</small>', 'Hectares monitorados'], ['98<small>%</small>', 'Dos incêndios: nossa IA vê primeiro']] }
    },
    agents: {
      en: { eyebrow: '02 — Self-hosted on Hermes · in production', title: 'Production Agents',
            g: [['9', 'Agents, one control plane'], ['1/3', 'Of the company uses them'], ['520', 'PRs merged across 35 repos']] },
      pt: { eyebrow: '02 — Self-hosted no Hermes · em produção', title: 'Agentes em produção',
            g: [['9', 'Agentes, um control plane'], ['1/3', 'Da empresa usa'], ['520', 'PRs mergeadas em 35 repositórios']] }
    },
    forefire: {
      en: { eyebrow: '03 — Open source · CNRS / Université de Corse', title: 'ForeFire',
            g: [['2022', 'Contributor'], ['2025', 'Maintainer'], ['JOSS', 'Co-author on the paper']] },
      pt: { eyebrow: '03 — Open source · CNRS / Université de Corse', title: 'ForeFire',
            g: [['2022', 'Contribuidor'], ['2025', 'Mantenedor'], ['JOSS', 'Coautor do paper']] }
    }
  }[P][L];
  document.getElementById('eyebrow').innerHTML = T.eyebrow;
  document.getElementById('title').innerHTML = T.title;
  if (T.lede) document.getElementById('lede').innerHTML = T.lede; else document.getElementById('lede').remove();
  if (P === 'home') { document.getElementById('who').textContent = ''; document.body.classList.add('home'); }
  document.getElementById('gauges').innerHTML = T.g.map(function (g) {
    return '<div class="gauge"><div class="n">' + g[0] + '</div><p>' + g[1] + '</p></div>';
  }).join('');
  /* home: a mesma foto de campo em dither do hero; projetos: a fumaça procedural de cada página */
  var bg = document.getElementById('bg');
  if (P === 'home') { bg.dataset.src = '../../assets/images/projects/pantera-detection-field.webp'; }
  else bg.dataset.atmo = '';
</script>
<script src="../../assets/js/ember-atmo.js"></script>
</body>
</html>
