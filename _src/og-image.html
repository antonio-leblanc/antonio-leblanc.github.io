<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    background: #0a0b0a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  .topbar-line {
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #f9a522, #ffc861);
  }
  .content {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 780px;
    display: flex; flex-direction: column; justify-content: center;
    padding-left: 80px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    color: #9ba095;
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-bottom: 22px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f9a522;
    display: inline-block;
  }
  h1 {
    color: #f2efe8;
    font-size: 46px; font-weight: 800;
    line-height: 1.18; letter-spacing: -0.01em;
    margin-bottom: 26px;
  }
  .divider {
    width: 130px; height: 1px;
    background: #7a7e75;
    opacity: 0.5;
    margin-bottom: 28px;
  }
  .stats {
    display: flex; gap: 46px;
  }
  .stat-num {
    color: #f9a522;
    font-size: 28px; font-weight: 800;
  }
  .stat-label {
    color: #9ba095;
    font-size: 13px; margin-top: 4px;
  }
  .avatar {
    position: absolute;
    right: 20px; bottom: -15px;
    height: 640px;
    width: auto;
  }
</style>
</head>
<body>
  <div class="topbar-line"></div>
  <div class="content">
    <p class="eyebrow"><span class="dot"></span> Antonio Leblanc</p>
    <h1>Intern to CTO in ten months.<br>The rest is Pantera.</h1>
    <div class="divider"></div>
    <div class="stats">
      <div>
        <div class="stat-num">40M+</div>
        <div class="stat-label">hectares monitored</div>
      </div>
      <div>
        <div class="stat-num">190</div>
        <div class="stat-label">cameras in the field</div>
      </div>
      <div>
        <div class="stat-num">150</div>
        <div class="stat-label">towers deployed</div>
      </div>
    </div>
  </div>
  <img class="avatar" src="../assets/images/avatar.png">
</body>
</html>
